[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fine-tuning"
version = "0.1.0"
description = "Full supervised fine-tuning of an open-source language model with reproducible training and evaluation."
requires-python = ">=3.11,<3.13"

dependencies = [
    "transformers",
    "datasets",
    "accelerate",
    "evaluate",
    "mlflow",
    "PyYAML",
    "optuna",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[tool.setuptools.packages.find]
where = ["src"]